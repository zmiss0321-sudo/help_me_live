<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>帮我活一下</title>
<style>
/* ==================== TOKENS ==================== */
:root {
  /* Cement Gray Theme — 水泥灰 + 手机通知轰炸 */
  --color-bg-main: #DDE5E1;
  --color-panel-bg: #EEF2F0;
  --color-card-bg: #FCF9F4;
  --color-text-main: #202627;
  --color-text-secondary: #5A6260;
  --color-danger: #FF4D2E;
  --color-danger-soft: #FF7A66;
  --color-cyan: #00BFC6;
  --color-neutral-progress: #A9B8AE;
  --color-border: #D6DEDA;
  --color-structure: #202627;
  --popup-button-bg: rgba(252, 249, 244, 0.75);
  --popup-button-border: #D6DEDA;
  --popup-button-text: #5A6260;
  --popup-button-hover-bg: #EEF2F0;
  --bg-main: var(--color-bg-main); --bg-noise: rgba(0,191,198,.10); --bg-section: var(--color-panel-bg);
  --bg-card: var(--color-card-bg); --bg-card-front: #fffdfa; --bg-card-active: #F7F2EB; --bg-card-sub: #F2EDE6;
  --bg-deeper: #D1DCD7; --surface: var(--color-panel-bg); --surface-raised: #F6F8F7; --surface-focus: var(--popup-button-hover-bg);
  --text-main: var(--color-text-main); --text-sub: var(--color-text-secondary); --text-muted: #77817E; --text-tertiary: var(--color-text-secondary);
  --text-light: var(--color-text-main); --text-on-dark: var(--color-text-main);
  --text-warning: var(--color-danger-soft); --text-danger: var(--color-danger);
  --border-subtle: var(--color-border); --border-card: var(--color-border); --border-soft: var(--color-border);
  --border-active: rgba(32,38,39,0.24); --border-strong: rgba(32,38,39,0.28);
  --border-warning: rgba(255,77,46,0.58);
  --accent: var(--color-cyan); --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --font-stack: -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --shadow-card: 0 1px 2px rgba(32,38,39,0.10), 0 8px 22px rgba(32,38,39,0.12);
  --shadow-card-front: 0 2px 8px rgba(32,38,39,0.16), 0 14px 34px rgba(32,38,39,0.18);
  --progress-gray: var(--color-neutral-progress); --progress-bg: #DCE4E0;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100dvh;height:100vh;overflow:hidden;font-family:var(--font-stack);background:var(--bg-main);color:var(--text-on-dark);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}

/* ==================== SCREENS ==================== */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s;z-index:1}
.screen.hidden{opacity:0;pointer-events:none;z-index:0}

/* ==================== INTRO ==================== */
#screen-intro{background:var(--bg-main);text-align:center;padding:20px}
.intro-glitch{font-size:11px;color:var(--text-muted);letter-spacing:3px;margin-bottom:24px;animation:flicker 4s infinite}
.intro-title{font-size:34px;font-weight:800;color:var(--text-light);letter-spacing:6px;margin-bottom:16px}
.intro-subtitle{font-size:13px;color:var(--text-sub);line-height:2;margin-bottom:56px;letter-spacing:1px}
.intro-btn{display:inline-block;padding:16px 52px;border:1px solid var(--border-soft);border-radius:50px;color:var(--text-light);font-size:14px;letter-spacing:4px;cursor:pointer;background:transparent;transition:background .25s,border-color .25s}
.intro-btn:active{background:var(--surface-focus);border-color:var(--text-light)}
.intro-ver{font-size:10px;color:var(--text-muted);margin-top:48px;letter-spacing:2px}

/* ==================== TUTORIAL ==================== */
#screen-tutorial{background:var(--bg-main);padding:0;overflow-y:auto;justify-content:flex-start;min-height:100dvh}
#tutorial-content{display:flex;flex-direction:column;min-height:100dvh;width:100%}
.tutorial-intro{text-align:center;padding:40px 20px 20px}
.tutorial-avatar-wrap{width:64px;height:64px;border-radius:50%;background:#F3E6D8;border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:avatarBreath 4s ease-in-out infinite;position:relative}
.tutorial-avatar-wrap::after{content:'';position:absolute;right:8px;top:13px;width:9px;height:14px;border-radius:50% 50% 55% 45%;background:rgba(0,191,198,.28);transform:rotate(18deg)}
.tutorial-avatar-emoji{font-size:30px;line-height:1;filter:saturate(.9)}
.tutorial-title{font-size:17px;font-weight:700;letter-spacing:4px;margin-bottom:12px;color:var(--text-light)}
.tutorial-desc{font-size:13px;color:var(--text-sub);line-height:2;letter-spacing:1px;max-width:260px;margin:0 auto}
.tutorial-btn{display:block;margin:32px auto 0;padding:13px 40px;border:1px solid var(--border-soft);border-radius:50px;color:var(--text-light);font-size:14px;letter-spacing:3px;cursor:pointer;background:transparent;transition:background .25s,border-color .25s}
.tutorial-btn:active{background:var(--surface-focus);border-color:var(--text-light)}
.tutorial-step-indicator{text-align:center;padding:16px 0 8px;font-size:11px;color:var(--text-muted);letter-spacing:3px;flex-shrink:0}
.tutorial-card-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;gap:12px}
.tutorial-demo-card{width:82vw;max-width:400px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-lg);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;box-shadow:var(--shadow-card);color:var(--text-main)}
.tutorial-demo-card:active{cursor:grabbing}
.tutorial-demo-card.dragging{cursor:grabbing;box-shadow:var(--shadow-card-front);background:var(--bg-card-active);border-color:var(--border-active);z-index:10}
.tutorial-demo-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-size:10px}
.tutorial-demo-source{color:var(--text-sub);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.tutorial-demo-source-icon{font-size:14px;filter:saturate(.8)}
.tutorial-demo-body{padding:10px 14px 8px;font-size:13px;color:var(--text-main);line-height:1.7;min-height:36px}
.tutorial-demo-hints{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px 12px;font-size:10px;color:var(--text-sub);letter-spacing:1px;border-top:1px solid var(--border-subtle);margin:0 8px;pointer-events:none}
.tutorial-demo-hint-sep{color:var(--text-muted);font-size:8px}
.tutorial-demo-card .hold-ring{position:absolute;bottom:10px;right:10px;width:28px;height:28px;border-radius:50%;border:2px solid transparent;border-top-color:var(--progress-gray);opacity:0;transition:opacity .15s}
.tutorial-demo-card .hold-ring.active{opacity:1;animation:holdSpin 1s linear infinite}
.tutorial-demo-card .hold-ring.done{border-top-color:var(--text-sub);opacity:1;animation:none}
.tutorial-demo-card .rapid-dots{position:absolute;top:8px;right:40px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.tutorial-demo-card .rapid-dots span{width:5px;height:5px;border-radius:50%;background:var(--text-muted);transition:background .15s}
.tutorial-demo-card .rapid-dots span.filled{background:var(--text-sub)}
.tutorial-demo-card .rapid-dots.active{opacity:1}
.tutorial-swipe-fb{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.tutorial-swipe-fb.left{right:calc(100% + 10px);color:var(--text-sub)}
.tutorial-swipe-fb.right{left:calc(100% + 10px);color:var(--text-main)}
.tutorial-swipe-fb.up{bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--text-sub)}
.tutorial-swipe-fb.down{top:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--text-sub)}
.tutorial-swipe-fb.show{opacity:1}
.tutorial-swipe-fb.trigger{opacity:1;font-size:15px}
.tutorial-feedback-area{flex-shrink:0;padding:0 16px 12px;min-height:20px;width:100%;max-width:440px;margin:0 auto}
.tutorial-result{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:14px;text-align:center;color:var(--text-light)}
.tutorial-result-choice{font-size:11px;color:var(--text-muted);letter-spacing:1px;margin-bottom:8px}
.tutorial-result-choice span{color:var(--text-light)}
.tutorial-result-effects{display:flex;justify-content:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tutorial-result-eff{font-size:10.5px;letter-spacing:.5px}
.tutorial-result-eff.pos{color:var(--text-light)}.tutorial-result-eff.neg{color:var(--text-danger)}
.tutorial-result-explain{font-size:11px;color:var(--text-muted);line-height:1.6;letter-spacing:.5px;margin-bottom:12px}
.tutorial-result-btns{display:flex;gap:8px;justify-content:center}
.tutorial-result-btns button{padding:10px 20px;border-radius:20px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:var(--font-stack);background:transparent;transition:background .2s,border-color .2s}
.tutorial-retry-btn{border:1px solid var(--border-soft);color:var(--text-muted)}
.tutorial-retry-btn:active{background:var(--surface-focus)}
.tutorial-next-btn{border:1px solid var(--border-active);color:var(--text-light)}
.tutorial-next-btn:active{background:var(--surface-focus)}
.tutorial-start-btn{border:1px solid var(--text-light);color:var(--text-light);padding:12px 32px}
.tutorial-start-btn:active{background:var(--surface-focus)}
.tutorial-final{text-align:center;padding:20px 0}
.tutorial-final-q{font-size:14px;color:var(--text-muted);letter-spacing:1px;margin-bottom:20px}
.tutorial-final-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tutorial-nav-area{flex-shrink:0;padding:8px 16px 20px;text-align:center}
.tutorial-result{max-width:360px;margin:0 auto;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:13px 14px;text-align:left;box-shadow:var(--shadow-card);color:var(--text-light)}
.tutorial-result-choice{font-size:12px;color:var(--text-muted);letter-spacing:1px;margin-bottom:8px}.tutorial-result-choice span{color:var(--text-light);font-weight:800}
.tutorial-result-effects{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 9px}
.tutorial-result-eff{font-size:11px;letter-spacing:.5px;padding:6px 7px;border:1px solid var(--border-subtle);border-radius:7px;background:rgba(252,249,244,.32)}
.tutorial-result-eff.pos{color:var(--text-light)}.tutorial-result-eff.neg{color:var(--text-danger)}.tutorial-result-eff.zero{color:var(--text-muted)}
.tutorial-result-explain{font-size:11px;color:var(--text-sub);line-height:1.55;letter-spacing:.5px;margin-bottom:10px}
.tutorial-result-btns{text-align:center}.tutorial-result-btns button{padding:10px 24px;border:1px solid var(--border-active);border-radius:50px;background:transparent;color:var(--text-light);font-size:12px;letter-spacing:2px;font-family:var(--font-stack)}
.tutorial-rules{width:100%;max-width:380px;margin:auto;padding:20px 18px;color:var(--text-main)}
.tutorial-rules-title{font-size:18px;line-height:1.5;font-weight:800;letter-spacing:2px;color:var(--text-light);text-align:center;margin-bottom:14px}
.tutorial-rules-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:14px;box-shadow:var(--shadow-card)}
.tutorial-rules-item{font-size:12px;line-height:1.55;color:var(--text-sub);padding:7px 0;border-bottom:1px solid var(--border-subtle)}.tutorial-rules-item:last-child{border-bottom:0}
.tutorial-rules-item b{color:var(--text-light);font-size:12px}.tutorial-rules-note{font-size:12px;line-height:1.7;color:var(--text-muted);margin:12px 0;text-align:left}
.tutorial-rules-go{display:block;margin:14px auto 0;padding:12px 38px;border:1px solid var(--text-light);border-radius:50px;background:transparent;color:var(--text-light);font-size:13px;letter-spacing:3px;font-family:var(--font-stack)}

/* ==================== LOADING ==================== */
#screen-loading{background:var(--bg-main);padding:20px}
.loading-title{font-size:14px;color:var(--text-muted);letter-spacing:2px;margin-bottom:44px}
.loading-list{list-style:none;width:100%;max-width:280px}
.loading-list li{font-size:12px;color:var(--text-muted);padding:10px 0;border-bottom:1px solid var(--color-border);letter-spacing:1px;transition:color .4s}
.loading-list li.done{color:var(--text-sub)}
.loading-list li.current{color:var(--text-light);animation:pulse .8s infinite}
.loading-done{font-size:14px;color:var(--text-light);margin-top:44px;letter-spacing:2px;opacity:0;transition:opacity .6s}
.loading-done.show{opacity:1}
.loading-tag{font-size:11px;color:var(--text-muted);margin-top:14px;letter-spacing:1px;opacity:0;transition:opacity .6s .4s}
.loading-tag.show{opacity:1}

/* ==================== GAME SCREEN ==================== */
#screen-game{background:var(--bg-main);flex-direction:column;justify-content:flex-start;padding:0;overflow:hidden;padding-bottom:80px}

#fake-statusbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 18px 4px;font-size:10px;color:var(--text-muted);background:var(--bg-deeper);flex-shrink:0;border-bottom:1px solid var(--color-border)}
#fake-statusbar .time{color:var(--text-sub);letter-spacing:1px;font-variant-numeric:tabular-nums}
#fake-statusbar .icons{display:flex;gap:8px;align-items:center;font-size:9px}
#fake-statusbar .signal{color:var(--color-danger);letter-spacing:1px;font-weight:700}
#fake-statusbar .battery{width:20px;height:9px;border:1px solid rgba(32,38,39,.22);border-radius:2px;padding:1px;position:relative}
#fake-statusbar .battery::after{content:'';position:absolute;right:-3px;top:1.5px;width:2px;height:4px;background:rgba(32,38,39,.22);border-radius:0 1px 1px 0}
#fake-statusbar .battery-inner{height:100%;background:var(--progress-gray);border-radius:1px;transition:width .5s}

#game-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;flex-shrink:0;background:var(--bg-section);border-bottom:1px solid var(--color-border)}
#game-header .title{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--text-muted)}
#game-header .phase-tag{font-size:9px;color:var(--text-danger);background:rgba(255,77,46,.08);padding:3px 10px;border-radius:10px;letter-spacing:2px;border:1px solid rgba(255,77,46,.18)}

/* ---- Stat cards row ---- */
#stats-area{width:100%;padding:10px 12px 8px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-section);border-bottom:1px solid var(--color-border)}
.stat-card{background:rgba(252,249,244,.42);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stat-card-header{display:flex;align-items:center;gap:6px}
.stat-card-icon{font-size:16px;line-height:1;color:var(--color-structure);filter:none}
.stat-card-name{font-size:10px;color:var(--text-muted);letter-spacing:1px;font-weight:600}
.stat-card-val{font-size:11px;color:var(--text-light);font-variant-numeric:tabular-nums;text-align:right;flex:1}
.stat-card-bar-wrap{width:100%;height:4px;background:var(--progress-bg);border-radius:2px;overflow:hidden}
.stat-card-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.stat-card-warn{font-size:8px;color:var(--text-danger);display:none;animation:blink .7s infinite}

.stat-card-bar-fill.flash{filter:brightness(1.6)}

/* Avatar */
#avatar-area{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;flex-shrink:0;gap:4px;background:var(--bg-section)}
#avatar-wrap{width:48px;height:48px;border-radius:50%;background:#F3E6D8;border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center;transition:border-color .5s,box-shadow .5s;animation:avatarBreath 4s ease-in-out infinite;position:relative}
#avatar-wrap::before{content:'';position:absolute;left:8px;top:12px;width:4px;height:11px;border-left:2px solid var(--color-danger-soft);border-right:2px solid var(--color-danger-soft);transform:rotate(-18deg);opacity:.75}
#avatar-wrap::after{content:'';position:absolute;right:7px;top:12px;width:7px;height:11px;border-radius:50% 50% 55% 45%;background:rgba(0,191,198,.32);transform:rotate(18deg)}
#avatar-emoji{font-size:22px;line-height:1;transition:transform .3s;filter:saturate(.85)}
#avatar-wrap.danger{border-color:rgba(255,77,46,.55);box-shadow:0 0 18px rgba(255,77,46,.25);animation:avatarDangerPulse .8s infinite}
#avatar-wrap.warning{border-color:rgba(255,122,102,.45);box-shadow:0 0 10px rgba(255,122,102,.14)}
#avatar-wrap.danger #avatar-emoji{animation:avatarShake .3s infinite}
#avatar-status{font-size:9px;color:var(--text-muted);letter-spacing:1.5px;max-width:180px;text-align:center;transition:color .5s}
#avatar-status.danger-text{color:var(--text-danger)}
#avatar-status.warning-text{color:var(--text-danger)}

/* Popup layer */
#popup-layer{flex:1;width:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,var(--bg-noise) 0%,transparent 54%),linear-gradient(180deg,rgba(238,242,240,.92),var(--bg-main));padding-bottom:90px}

/* ---- Popup cards (light gray notification style) ---- */
.popup{position:absolute;width:86%;max-width:340px;background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-soft);box-shadow:var(--shadow-card);z-index:10;cursor:grab;transition:transform .25s cubic-bezier(.25,.8,.25,1.2),opacity .3s,box-shadow .3s,border-color .3s,background .3s,left .25s,top .25s;animation:popupIn .2s cubic-bezier(.175,.885,.32,1.275);color:var(--text-main)}
.popup::before{content:'';position:absolute;left:0;top:0;width:100%;height:3px;background:var(--color-danger);border-radius:var(--radius-lg) var(--radius-lg) 0 0;opacity:.72;transform:scaleX(var(--countdown-progress,1));transform-origin:left center;transition:transform .2s linear}
.popup:active{cursor:grabbing}

/* Stack layers — darken deeper cards (rotation via JS dataset) */
.popup.stack-deep{opacity:.52;filter:saturate(.85);pointer-events:none}
.popup.stack-mid{opacity:.74;filter:saturate(.92)}
.popup.stack-front{opacity:1;filter:none}
.popup.dragging{cursor:grabbing;box-shadow:var(--shadow-card-front);transition:none;z-index:100!important;background:var(--bg-card-front);border-color:var(--border-active);transform:none!important}
.popup.urgent{border-color:var(--border-warning);animation:urgentPulse 1s infinite}
.popup.critical-time{border-color:var(--text-danger);animation:urgentPulse .5s infinite;box-shadow:0 0 20px rgba(255,77,46,.22)}
.popup.timed-out{animation:popupExplode .35s forwards;pointer-events:none}

/* Swipe feedback overlay */
.popup-swipe-fb{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.popup-swipe-fb.left{right:calc(100% + 10px);color:var(--text-sub)}
.popup-swipe-fb.right{left:calc(100% + 10px);color:var(--text-main)}
.popup-swipe-fb.up{bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--text-sub)}
.popup-swipe-fb.down{top:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--text-sub)}
.popup-swipe-fb.show{opacity:1}
.popup-swipe-fb.trigger{opacity:1;font-size:15px}

/* Card internals */
.popup-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-size:10px}
.popup-source{display:flex;align-items:center;gap:6px;color:var(--text-sub);letter-spacing:1px;font-weight:600}
.popup-source-icon{font-size:14px;filter:saturate(.8)}
.popup-timer{font-size:12px;color:var(--text-sub);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px}
.popup-timer.urgent{color:var(--text-danger);animation:blink .6s infinite}
.popup-countdown-bar{height:2px;background:rgba(90,98,96,.08);margin:0 14px;border-radius:1px;overflow:hidden;position:relative}
.popup-countdown-bar.urgent{background:rgba(255,77,46,.08)}
.popup-countdown-fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--progress-gray);border-radius:1px;transition:transform .2s linear;transform-origin:left center}
.popup-countdown-fill.urgent{background:var(--text-danger)}
.popup-body{padding:8px 14px 6px;font-size:13px;color:var(--text-main);line-height:1.6;min-height:36px;letter-spacing:.5px}

/* Gesture hints — gray capsule pills */
.popup-hints{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 14px 10px;font-size:9px;color:var(--text-sub);letter-spacing:1px;border-top:1px solid var(--border-subtle);margin:0 8px;pointer-events:none}
.popup-hints span{background:var(--popup-button-bg);padding:2px 8px;border-radius:10px;border:1px solid var(--popup-button-border);color:var(--popup-button-text);box-shadow:0 1px 3px rgba(32,38,39,.05)}
.popup-hints .hint-sep{color:var(--text-muted);font-size:8px;opacity:.7;background:none;border:none;padding:0}

/* Long press progress ring */
.popup .hold-ring{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid transparent;border-top-color:var(--progress-gray);opacity:0;transition:opacity .15s}
.popup .hold-ring.active{opacity:1;animation:holdSpin 1s linear infinite}
.popup .hold-ring.done{border-top-color:var(--text-sub);opacity:1;animation:none}

/* Rapid click feedback */
.popup .rapid-dots{position:absolute;top:8px;right:40px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.popup .rapid-dots span{width:5px;height:5px;border-radius:50%;background:var(--text-muted);transition:background .15s}
.popup .rapid-dots span.filled{background:var(--text-sub)}

/* Random event card */
.popup.random-event{border-color:rgba(255,77,46,.48);box-shadow:0 2px 20px rgba(255,77,46,.14)}

/* Empty state hint */
#empty-hint{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:var(--text-muted);letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity 1s;text-align:center;z-index:5}
#empty-hint.show{opacity:1}

/* Pressure indicator */
#pressure-indicator{position:absolute;top:8px;right:12px;font-size:9px;color:var(--text-muted);letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .5s;z-index:160}
#pressure-indicator.show{opacity:1}
#pressure-indicator.high{color:var(--text-danger);animation:blink 1s infinite}

/* Phase transition */
#phase-transition{position:absolute;inset:0;z-index:300;background:rgba(28,30,33,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
#phase-transition.show{opacity:1;pointer-events:auto}
.phase-trans-phase{font-size:11px;color:var(--text-muted);letter-spacing:4px;margin-bottom:20px}
.phase-trans-name{font-size:28px;font-weight:700;color:var(--text-light);letter-spacing:6px;margin-bottom:16px}
.phase-trans-desc{font-size:14px;color:var(--text-sub);line-height:2;text-align:center;letter-spacing:1px;max-width:260px}
.phase-trans-btn{margin-top:40px;padding:12px 40px;border:1px solid var(--border-soft);border-radius:50px;color:var(--text-light);font-size:13px;letter-spacing:3px;cursor:pointer;background:transparent;transition:background .25s,border-color .25s}
.phase-trans-btn:active{background:var(--surface-focus);border-color:var(--text-light)}

#crisis-overlay{position:absolute;inset:0;pointer-events:none;z-index:150;background:transparent;transition:background .3s,box-shadow .3s}
#crisis-overlay.active{background:rgba(255,77,46,.045);box-shadow:inset 0 0 40px rgba(255,77,46,.10)}
.system-toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-muted);background:rgba(252,249,244,.96);padding:7px 16px;border-radius:16px;border:1px solid var(--color-border);letter-spacing:1px;pointer-events:none;z-index:180;animation:toastFade 3s forwards;box-shadow:0 4px 18px rgba(32,38,39,.12)}

/* ==================== BOTTOM ACTION BAR ==================== */
#bottom-bar{width:100%;display:flex;justify-content:space-around;align-items:center;padding:10px 16px;padding-bottom:max(10px, env(safe-area-inset-bottom, 10px));flex-shrink:0;background:var(--bg-deeper);border-top:1px solid var(--color-border);position:absolute;bottom:0;left:0;z-index:200}

/* ==================== EMERGENCY DRAWER ==================== */
#emergency-drawer{position:absolute;bottom:0;left:0;right:0;max-height:55vh;background:var(--bg-deeper);border-top:1px solid var(--color-border);border-radius:20px 20px 0 0;z-index:250;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1.2);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -4px 24px rgba(32,38,39,.22)}

const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function beep(f,d,t='square',v=.05){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sfxPopup(){beep(800,.08,'square',.04);beep(1000,.06,'square',.03)}
function sfxClick(){beep(600,.05,'sine',.03)}
function sfxTimeout(){beep(100,.4,'sawtooth',.08)}
function sfxLongPress(){beep(1200,.15,'sine',.05)}
function sfxPhase(){beep(300,.5,'triangle',.06)}
function sfxEnd(){beep(400,.8,'triangle',.07)}
function sfxWarning(){beep(200,.3,'sawtooth',.06)}
function sfxBurst(){beep(900,.06,'square',.05);beep(600,.04,'square',.04)}

  /* Build hint text from action — describes the gesture, NOT a button */
  _hintText(a){
    switch(a.gesture){
      case'swipe_left':return'← '+a.label;
      case'swipe_right':return a.label+' →';
      case'swipe_up':return'↑ '+a.label;
      case'swipe_down':return'↓ '+a.label;
      case'click':return'点击'+a.label;
      case'longpress':return'长按'+a.label;
      case'rapid_click':return'连点'+a.label;
      default:return a.label;
    }
  },

  renderDemoCard(){
    const d=this.currentDemo;
    const hintItems=d.actions.map(a=>this._hintText(a));
    const hintsHTML=hintItems.map(h=>`<span>${h}</span>`).join('<span class="tutorial-demo-hint-sep"> · </span>');
    const hasLong=d.actions.some(a=>a.gesture==='longpress');
    const hasRapid=d.actions.some(a=>a.gesture==='rapid_click');
    dom.tutorialContent.innerHTML=`
      <div class="tutorial-step-indicator">示范 ${this.demoIndex+1} / ${TUTORIAL_DEMOS.length}</div>
      <div class="tutorial-card-stage">
        <div class="tutorial-demo-card" id="demo-card">
          <div class="tutorial-demo-header">
            <span class="tutorial-demo-source"><span class="tutorial-demo-source-icon">${d.icon}</span>${d.source}</span>
          </div>
          <div class="tutorial-demo-body">${d.text}</div>
          <div class="tutorial-demo-hints">${hintsHTML}</div>
          ${hasLong?'<div class="hold-ring"></div>':''}
          ${hasRapid?'<div class="rapid-dots"><span></span><span></span><span></span><span></span><span></span></div>':''}
          <div class="tutorial-swipe-fb left"></div>
          <div class="tutorial-swipe-fb right"></div>
          <div class="tutorial-swipe-fb up"></div>
          <div class="tutorial-swipe-fb down"></div>
        </div>
        <div style="font-size:10px;color:var(--text-muted);letter-spacing:1px;text-align:center;pointer-events:none">← 拖动卡片来操作 →</div>
      </div>
      <div class="tutorial-feedback-area" id="tutorial-feedback"></div>
      <div class="tutorial-nav-area" id="tutorial-nav"></div>`;
    this.bindDemoEvents();
  },

  bindDemoEvents(){
    const d=this.currentDemo;
    const card=document.getElementById('demo-card');
    if(!card)return;
    let tx,ty,ts,lt,rtc=0,ltg=false,origX,origY,hm=false;
    const SWIPE_THRESH=70;
    const fbL=card.querySelector('.tutorial-swipe-fb.left');
    const fbR=card.querySelector('.tutorial-swipe-fb.right');
    const fbU=card.querySelector('.tutorial-swipe-fb.up');
    const fbD=card.querySelector('.tutorial-swipe-fb.down');
    function hideAllFb(){fbL.classList.remove('show','trigger');fbR.classList.remove('show','trigger');fbU.classList.remove('show','trigger');fbD.classList.remove('show','trigger')}

    function onStart(cx,cy){
      initAudio();tx=cx;ty=cy;ts=Date.now();hm=false;ltg=false;
      origX=card.offsetLeft;origY=card.offsetTop;
      // Long press
      const lp=d.actions.find(a=>a.gesture==='longpress');
      if(lp){
        const dur=(lp.duration||3)*1000;
        const ring=card.querySelector('.hold-ring');
        if(ring)ring.classList.add('active');
        const st=Date.now();
        lt=setInterval(()=>{
          const pct=Math.min(100,((Date.now()-st)/dur)*100);
          if(ring)ring.style.background=`conic-gradient(var(--color-neutral-progress) ${pct*3.6}deg, transparent 0)`;
          if(Date.now()-st>=dur&&!ltg){
            ltg=true;clearInterval(lt);

    function onMove(cx,cy){
      const dx=cx-tx,dy=cy-ty;
      if(Math.abs(dx)>3||Math.abs(dy)>3){
        hm=true;
        if(lt){clearInterval(lt);lt=null;
          const ring=card.querySelector('.hold-ring');if(ring){ring.classList.remove('active','done');ring.style.background=''}}
      }
      card.style.transform=`translate(${dx}px, ${dy}px)`;
      card.classList.add('dragging');
      hideAllFb();
      if(Math.abs(dx)>Math.abs(dy)){
        if(dx<-15){
          const a=d.actions.find(x=>x.gesture==='swipe_left');
          if(a){fbL.textContent=a.label;fbL.classList.add('show');if(dx<-SWIPE_THRESH)fbL.classList.add('trigger')}
        }
        if(dx>15){
          const a=d.actions.find(x=>x.gesture==='swipe_right');
          if(a){fbR.textContent=a.label;fbR.classList.add('show');if(dx>SWIPE_THRESH)fbR.classList.add('trigger')}
        }
      }else{
        if(dy<-15){
          const a=d.actions.find(x=>x.gesture==='swipe_up');
          if(a){fbU.textContent=a.label;fbU.classList.add('show');if(dy<-SWIPE_THRESH)fbU.classList.add('trigger')}
        }
        if(dy>15){
          const a=d.actions.find(x=>x.gesture==='swipe_down');
          if(a){fbD.textContent=a.label;fbD.classList.add('show');if(dy>SWIPE_THRESH)fbD.classList.add('trigger')}
        }
      }
    }

    function onEnd(cx,cy){
      card.classList.remove('dragging');
      card.style.transform='translate(0,0)';
      hideAllFb();
      if(lt){clearInterval(lt);lt=null;
        const ring=card.querySelector('.hold-ring');if(ring){ring.classList.remove('active','done');ring.style.background=''}}
      if(ltg)return;
      const dx=(cx||tx)-tx,dy=(cy||ty)-ty,dt=Date.now()-ts;

      // Swipe gestures
      if(Math.abs(dx)>Math.abs(dy)){
        if(dx<-SWIPE_THRESH){const a=d.actions.find(x=>x.gesture==='swipe_left');if(a){sfxClick();Tutorial.resolveDemo(a);return}}
        if(dx>SWIPE_THRESH){const a=d.actions.find(x=>x.gesture==='swipe_right');if(a){sfxClick();Tutorial.resolveDemo(a);return}}
      }else{
        if(dy<-SWIPE_THRESH){const a=d.actions.find(x=>x.gesture==='swipe_up');if(a){sfxClick();Tutorial.resolveDemo(a);return}}
        if(dy>SWIPE_THRESH){const a=d.actions.find(x=>x.gesture==='swipe_down');if(a){sfxClick();Tutorial.resolveDemo(a);return}}
      }

    }

    card.addEventListener('mousedown',e=>{document.addEventListener('mousemove',onMouseMove);document.addEventListener('mouseup',onMouseUp)});
  },

  resolveDemo(action){

            </div>
          </div>

  },

// ==================== PRESSURE & SPAWN SYSTEM ====================
function updatePressure(){
  if(Game.ended||Game.paused)return;
  const n=Game.popups.length;
  const minStat=Math.min(...Object.values(Game.stats));
  let target=1;
  // Card count drives pressure (higher thresholds)
  if(n>=5)target=4;else if(n>=4)target=3;else if(n>=3)target=2;else if(n===0)target=0;else target=1;
  // Low stats amp pressure (higher thresholds)
  if(minStat<15)target=Math.max(target,3);
  else if(minStat<28)target=Math.max(target,2);
  // Player neglect
  if(Game.consecutiveIgnores>=3)target=Math.max(target,3);
  else if(Game.consecutiveIgnores>=2)target=Math.max(target,2);
  // Burst window overrides
  if(Date.now()<Game.burstUntil)target=Math.max(target,4);
  // Smooth transition
  Game.pressureLevel=Math.round((Game.pressureLevel+target)/2);
  if(Game.pressureLevel<target)Game.pressureLevel=target; // can jump up fast, drift down slow
  // Update display
  const labels=['喘口气','','','高压...','!!'];
  dom.phaseTag.textContent=Game.pressureLevel>=3?labels[Game.pressureLevel]:'';
  const pind=dom.pressureInd;
  pind.classList.remove('show','high');
  if(Game.pressureLevel>=4){pind.textContent='失控';pind.classList.add('show','high')}
  else if(Game.pressureLevel>=3){pind.textContent='高压';pind.classList.add('show','high')}
  else if(Game.pressureLevel>=2){pind.textContent='积压';pind.classList.add('show')}
  // Shaking at burst
  dom.game.classList.toggle('shaking',Game.pressureLevel>=4);
  // State message every ~30-35s
  const elapsed=(Date.now()-Game.gameStartTime)/1000;
  const block=Math.floor(elapsed/32);
  if(!Game.stateMsgShown.has(block)&&elapsed>12&&elapsed-Game.lastStateMsgTime>28){
    Game.stateMsgShown.add(block);Game.lastStateMsgTime=elapsed;
    spawnStateMsg();
  }
}

  const t=document.createElement('div');
  t.className='system-toast';
  t.textContent=STATE_MSGS[Math.floor(Math.random()*STATE_MSGS.length)];
  dom.popupLayer.appendChild(t);
  setTimeout(()=>t.remove(),2500);

// Time-based event pool selection (smooth, not stages)

function getCardLimit(){
  const cfg=Game.pressureConfig[Game.pressureLevel];
  return cfg?cfg.maxCards:2;
}

function scheduleNextSpawn(){
  if(Game.ended||Game.paused)return;
  const cfg=Game.pressureConfig[Game.pressureLevel];
  const limit=cfg?cfg.maxCards:2;
  const delay=(cfg?cfg.spawnBase:1200)+Math.random()*(cfg?cfg.spawnRange:800);
  Game.spawnTimer=setTimeout(()=>{
    if(Game.ended||Game.paused){scheduleNextSpawn();return;}
    if(Date.now()<Game.quietUntil){scheduleNextSpawn();return;}
    if(Game.popups.length<limit)trySpawnEvent();
    checkRandomEvent();
    scheduleNextSpawn();
  },delay);
}

function trySpawnEvent(){
  if(Game.ended||Game.paused||Game.popups.length>=Game.pressureConfig[Game.pressureLevel].maxCards)return;
  const pk='phase'+getEventPhase(),pool=EVENTS[pk];
  let avail=pool.filter(e=>!Game.usedEvents.has(e.id));
  if(avail.length===0){Game.usedEvents.clear();avail=pool}
  const ev=avail[Math.floor(Math.random()*avail.length)];
  Game.usedEvents.add(ev.id);
  // Apply pressure-based timeout
  const cfg=Game.pressureConfig[Game.pressureLevel];
  const timeoutMult=cfg?cfg.timeoutMult:1.0;
  const origTimeout=ev.timeout;
  ev.timeout=Math.round(origTimeout*timeoutMult);
  const popup=spawnPopup(ev);
  ev.timeout=origTimeout; // restore
  // Occasionally spawn system toast at high pressure

// ==================== RANDOM EVENTS ====================
function checkRandomEvent(){
  if(Game.ended||Game.paused)return;
  const now=Date.now();
  if(now<Game.randomEventCooldown)return;
  const elapsed=(Date.now()-Game.gameStartTime)/1000;
  const block=Math.floor(elapsed/25);
  // Guarantee: at least 1 random per ~25s block after first 15s
  const needGuarantee=Game.randomEventsThisBlock<1&&elapsed>15;
  let chance=0;
  if(needGuarantee)chance=0.9;
  else if(Game.pressureLevel>=4)chance=0.45;
  else if(Game.pressureLevel>=3)chance=0.28;
  else if(Game.pressureLevel>=2)chance=0.12;
  else chance=0.05;
  // Player neglect boosts chance
  if(Game.consecutiveIgnores>=2)chance+=0.2;
  if(Game.consecutiveIgnores>=1)chance+=0.1;
  // Low stats
  const minStat=Math.min(...Object.values(Game.stats));
  if(minStat<25)chance+=0.2;
  if(Math.random()<chance)spawnRandomEvent();
  // Reset block counter
  const currentBlock=Math.floor((Date.now()-Game.gameStartTime)/1000/25);
  if(currentBlock!==Math.floor((Date.now()-5000-Game.gameStartTime)/1000/25)){
    // block changed, handled by pressure update
  }
}

function spawnRandomEvent(){
  const avail=RANDOM_EVENTS.filter(e=>!Game.randomEventsUsed.has(e.id));
  if(avail.length===0)Game.randomEventsUsed.clear();
  const pool=avail.length>0?avail:RANDOM_EVENTS;
  const ev=pool[Math.floor(Math.random()*pool.length)];
  Game.randomEventsUsed.add(ev.id);
  Game.randomEventsThisBlock++;
  Game.randomEventCooldown=Date.now()+5000+Math.random()*5000;
  Game.burstUntil=Date.now()+3000+Math.random()*3000;
  // Random events always jump to front with shorter timeout
  const popup=spawnPopup(ev,true);
  if(popup&&popup.el){
    popup.el.style.zIndex=++Game.zIndexCounter;
    updateCardLayers();
    // Brief screen flash
    dom.crisisOverlay.classList.add('active');
    setTimeout(()=>{if(Game.pressureLevel<3)dom.crisisOverlay.classList.remove('active')},400);
  }
}

// ==================== COUNTDOWN WITH URGENCY ====================
function updateCountdowns(){
  if(Game.paused)return;
  const now=Date.now();
  Game.popups.forEach(p=>{
    const elapsed=(now-parseInt(p.el.dataset.createdAt))/1000;
    const remaining=Math.max(0,p.timeoutSec-elapsed);
    const timerEl=p.el.querySelector('.popup-timer');
    const fillEl=p.el.querySelector('.popup-countdown-fill');
    if(timerEl){
      const rm=Math.ceil(remaining),rmm=Math.floor(rm/60),rss=Math.floor(rm%60);timerEl.textContent=rmm>0?String(rmm).padStart(2,'0')+':'+String(rss).padStart(2,'0'):'00:'+String(rss).padStart(2,'0');

    }
    // Progressive urgency
    p.el.classList.remove('urgent','critical-time');
    if(remaining<3){p.el.classList.add('critical-time');}
    else if(remaining<5){p.el.classList.add('urgent');}

// ==================== PHASE / TIME MANAGEMENT ====================
function checkPhase(){
  if(Game.ended||Game.paused)return;
  updateEmergencyBadge();updateClearCount();
  const elapsed=(Date.now()-Game.gameStartTime)/1000;
  Game.gameTime=elapsed;
  const bh=8,tm=Math.floor(elapsed*2.4),h=bh+Math.floor(tm/60),m=tm%60;
  dom.statusTime.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  updatePressure();
  // Reset random event block counter when entering new block
  const newBlock=Math.floor(elapsed/25);
  const oldBlock=Math.floor(Math.max(0,elapsed-0.3)/25);
  if(newBlock!==oldBlock)Game.randomEventsThisBlock=0;
  if((Game.totalSpawned||0)>=(Game.targetEventTotal||99)&&Game.popups.filter(p=>!p.resolved).length===0)endGame(true);
  if(elapsed>=Game.gameDuration&&!Game.ended)endGame(true);

function settlementMetrics(stats,tracker){const total=Math.max(1,tracker.totalPopups||0),completionRate=Math.round((tracker.handledPopups||0)/total*100),abandonRate=((tracker.ignoreCount||0)+(tracker.timedOutPopups||0)*.45)/total,restraintScore=abandonRate<=.08?42:abandonRate<=.36?100:Math.max(35,100-(abandonRate-.36)*160),healthScore=Math.round(stats.battery*.34+stats.emotion*.34+stats.persona*.22+Math.min(stats.progress,82)*.1),overdraftPenalty=Math.max(0,40-stats.battery)*1.1+Math.max(0,40-stats.emotion)*1.1+Math.max(0,35-stats.persona)*.75,completionPenalty=completionRate>=90?Math.max(0,55-stats.battery)*.45+Math.max(0,55-stats.emotion)*.45:0,selfPreservation=Math.max(0,Math.min(100,Math.round(healthScore*.72+restraintScore*.28-overdraftPenalty-completionPenalty)));return{completionRate,selfPreservation,abandonRate}}
function assessRating(survived,stats,tracker=Game.tracker){const m=settlementMetrics(stats,tracker),coreMin=Math.min(stats.battery,stats.emotion,stats.persona),fragile=[stats.battery,stats.emotion,stats.persona].filter(v=>v<40).length;if(m.completionRate>=90&&(stats.battery<=30||stats.emotion<=30))return{rank:'SLAVE',badge:'隐藏',name:'满分奴隶',text:'通知基本清空了。你也差不多。',metrics:m};if(!survived||coreMin<=8||m.selfPreservation<24)return{rank:'D',name:'人设破损，请及时下线',text:'系统还在运行，但用户已经不适合继续加载。',metrics:m};if(stats.battery>=62&&stats.emotion>=62&&stats.persona>=58&&m.selfPreservation>=76)return{rank:'S',name:'你没有把自己交出去',text:'你让几件事留在原地，也让自己留在了自己这边。',metrics:m};if(m.selfPreservation>=62&&coreMin>=46&&fragile===0)return{rank:'A',name:'今天没有彻底坏掉',text:'有些通知没有得到它想要的反应。很好，它会适应。',metrics:m};if(m.selfPreservation>=45&&coreMin>=30)return{rank:'B',name:'你很能干，但不太像活着',text:'你保住了场面，代价是把自己调成了省电模式。',metrics:m};if(m.selfPreservation>=28)return{rank:'C',name:'你的一天被别人使用了',text:'你一直在响应，像一台礼貌的公共设备。',metrics:m};return{rank:'D',name:'人设破损，请及时下线',text:'今天的表面工程到此为止。继续维护会扩大损坏。',metrics:m}}
function ratingReason(stats,rating){const m=rating.metrics||settlementMetrics(stats,Game.tracker),lows=[['生命电量',stats.battery],['情绪稳定',stats.emotion],['人设完整',stats.persona]].filter(x=>x[1]<45).sort((a,b)=>a[1]-b[1]);if(rating.rank==='SLAVE')return`完成率 ${m.completionRate}%，生命电量或情绪稳定却已经见底。系统无法把这叫优秀，只能叫服从性良好。`;if(rating.rank==='S')return`完成率不是最高也没关系。你保住了生命电量、情绪稳定和人设完整，还知道哪些事可以先不接住。`;if(rating.rank==='A')return lows.length?`你没有把自己透支到危险线以下，但${lows.map(x=>x[0]).join('和')}已经偏低，评级停在 A。`:'你没有明显崩盘，也没有把每条通知都当圣旨处理。评级为 A。';if(rating.rank==='B')return lows.length?`你处理了不少事，但${lows.slice(0,2).map(x=>x[0]).join('和')}偏低。能干是真的，不太像活着也是真的。`:'系统看到你还在撑，也看到你撑得很紧。评级为 B。';if(rating.rank==='C')return lows.length?`${lows.map(x=>x[0]).join('、')}都在危险区附近。你今天被安排得很满，尤其是被别人安排。`:'你看起来还在运转，里面已经开始空转。评级为 C。';return lows.length?`${lows[0][0]}已经接近见底。今天先别再证明自己还能扛了。`:'综合状态太低，系统建议下线。'}

function wrongGesture(el,msg='再看一下右下角提示'){el.classList.add('wrong-action');Game.pressureScore=Math.min(100,(Game.pressureScore||0)+2);showFeedback(el,msg);beep(150,.12,'sawtooth',.035);setTimeout(()=>el.classList.remove('wrong-action'),360)}
function bindPopupEvents(popup){const el=popup.el,eventData=popup.eventData;let sx=0,sy=0,st=0,origX=0,origY=0,down=false,moved=false,holdTimer=null,holdStart=0,rapidCount=0,lastTap=0;const SWIPE_X=104,SWIPE_Y=94,TAP_MOVE=14;
  function clearHold(){if(holdTimer){clearInterval(holdTimer);holdTimer=null}const ring=el.querySelector('.hold-ring');if(ring){ring.classList.remove('active','done');ring.style.background=''}}
  function actionFor(g){return eventData.actions.find(a=>a.gesture===g)}
  function startHold(a){const ring=el.querySelector('.hold-ring');if(!ring)return;holdStart=Date.now();ring.classList.add('active');const dur=Math.max(1200,(a.duration||2)*1000);holdTimer=setInterval(()=>{const pct=Math.min(100,((Date.now()-holdStart)/dur)*100);ring.style.background=`conic-gradient(var(--color-neutral-progress) ${pct*3.6}deg, transparent 0)`;if(pct>=100){clearHold();ring.classList.add('done');resolvePopup(popup,a)}},45)}
  el.addEventListener('pointerdown',e=>{if(Game.ended)return;if(!isFrontPopup(popup)){blockNonFrontPopup(popup);return}initAudio();down=true;moved=false;sx=e.clientX;sy=e.clientY;st=Date.now();origX=el.offsetLeft;origY=el.offsetTop;el.setPointerCapture?.(e.pointerId);el.style.zIndex=++Game.zIndexCounter;updateCardLayers();const lp=actionFor('longpress');if(lp)startHold(lp)});
  el.addEventListener('pointermove',e=>{if(!down||Game.ended||!isFrontPopup(popup))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6||Math.abs(dy)>6){moved=true;if(Math.abs(dx)>TAP_MOVE||Math.abs(dy)>TAP_MOVE)clearHold()}el.style.left=Math.max(-30,Math.min(dom.popupLayer.clientWidth-60,origX+dx))+'px';el.style.top=Math.max(0,Math.min(dom.popupLayer.clientHeight-80,origY+dy))+'px';el.classList.add('dragging')});
  el.addEventListener('pointerup',e=>{if(!down)return;down=false;el.classList.remove('dragging');clearHold();if(Game.ended||!isFrontPopup(popup))return;const dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st;let gesture=null;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>SWIPE_X)gesture=dx<0?'swipe_left':'swipe_right';else if(Math.abs(dy)>SWIPE_Y)gesture=dy<0?'swipe_up':'swipe_down';if(gesture){const a=actionFor(gesture);if(a){sfxClick();resolvePopup(popup,a);return}wrongGesture(el,'不是这样处理。')}else if(Math.abs(dx)<TAP_MOVE&&Math.abs(dy)<TAP_MOVE&&dt<420){const rc=actionFor('rapid_click'),ca=actionFor('click');if(rc){const now=Date.now();rapidCount=now-lastTap<650?rapidCount+1:1;lastTap=now;const dots=el.querySelector('.rapid-dots');if(dots){dots.classList.add('active');dots.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('filled',i<rapidCount))}if(rapidCount>1)sfxClick();if(rapidCount>=rc.clicks){resolvePopup(popup,rc);return}return}if(ca){sfxClick();resolvePopup(popup,ca);return}}const r=el.dataset.rotation||0;el.style.transition='left .22s cubic-bezier(.25,.8,.25,1.2), top .22s cubic-bezier(.25,.8,.25,1.2)';el.style.left=origX+'px';el.style.top=origY+'px';el.style.transform=`rotate(${r}deg)`;setTimeout(()=>{el.style.transition='transform .25s cubic-bezier(.25,.8,.25,1.2),opacity .3s,box-shadow .3s,border-color .3s,background .3s,left .25s,top .25s'},240)});
  el.addEventListener('pointercancel',()=>{down=false;clearHold();el.classList.remove('dragging')});
}

Tutorial.bindInteractiveDemo=function(){const d=this.currentDemo,card=document.getElementById('demo-card'),done=document.getElementById('demo-done');let sx=0,sy=0,origX=0,origY=0,down=false,moved=false,holdTimer=null,holdStart=0,taps=0,lastTap=0,completed=false;const pass=()=>{if(completed)return;completed=true;clearInterval(holdTimer);card.querySelector('.gesture-trace')?.remove();done.textContent=d.done;card.style.transition='transform .22s ease, opacity .22s ease';if(d.gesture==='left')card.style.transform='translateX(-120vw)';else if(d.gesture==='right')card.style.transform='translateX(120vw)';else if(d.gesture==='up')card.style.transform='translateY(-120px) scale(.82)';else if(d.gesture==='down')card.style.transform='translateY(24px) scale(1.03)';else card.style.transform='scale(.96)';setTimeout(()=>this.showGestureResult(d),520)};const retry=msg=>{done.textContent=msg;card.classList.add('wrong-action');setTimeout(()=>card.classList.remove('wrong-action'),350)};const clearHold=()=>{if(holdTimer){clearInterval(holdTimer);holdTimer=null}const ring=card.querySelector('.hold-ring');if(ring){ring.classList.remove('active','done');ring.style.background=''}};card.addEventListener('pointerdown',e=>{if(completed)return;initAudio();down=true;moved=false;sx=e.clientX;sy=e.clientY;origX=card.offsetLeft;origY=card.offsetTop;card.setPointerCapture?.(e.pointerId);if(d.gesture==='hold'){const ring=card.querySelector('.hold-ring');holdStart=Date.now();ring.classList.add('active');holdTimer=setInterval(()=>{const pct=Math.min(100,(Date.now()-holdStart)/1100*100);ring.style.background=`conic-gradient(var(--color-neutral-progress) ${pct*3.6}deg, transparent 0)`;if(pct>=100){ring.classList.add('done');pass()}},40)}});card.addEventListener('pointermove',e=>{if(!down||completed)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5){moved=true;if(d.gesture==='hold')clearHold()}card.style.transform=`translate(${dx}px,${dy}px)`});card.addEventListener('pointerup',e=>{if(!down||completed)return;down=false;if(d.gesture==='hold'){clearHold();retry('长按久一点');card.style.transform='translate(0,0)';return}const dx=e.clientX-sx,dy=e.clientY-sy;if(d.gesture==='tap'){if(Math.abs(dx)<14&&Math.abs(dy)<14){const now=Date.now();taps=now-lastTap<650?taps+1:1;lastTap=now;card.querySelectorAll('.rapid-dots span').forEach((s,i)=>s.classList.toggle('filled',i<taps));done.textContent=`还差 ${Math.max(0,3-taps)} 次`;if(taps>=3)pass();return}retry('需要连点 3 次');card.style.transform='translate(0,0)';return}let ok=false;if(d.gesture==='left')ok=dx<-88&&Math.abs(dx)>Math.abs(dy);if(d.gesture==='right')ok=dx>88&&Math.abs(dx)>Math.abs(dy);if(d.gesture==='up')ok=dy<-78&&Math.abs(dy)>Math.abs(dx);if(d.gesture==='down')ok=dy>78&&Math.abs(dy)>Math.abs(dx);if(ok)pass();else{retry(d.gesture==='left'?'往左滑':d.gesture==='right'?'往右滑':d.gesture==='up'?'往上滑':'往下滑');card.style.transition='transform .18s ease';card.style.transform='translate(0,0)';setTimeout(()=>card.style.transition='',180)}});card.addEventListener('pointercancel',()=>{down=false;clearHold();card.style.transform='translate(0,0)'})};

function actionPoolForType(type){if(type==='mom')return THREE_CHOICE_POOL.family;if(['teacher','boss','ddl','file','schedule','checkin'].includes(type))return THREE_CHOICE_POOL.authority;if(['group','social','friend','classmate','unread'].includes(type))return THREE_CHOICE_POOL.group;if(type==='alarm')return THREE_CHOICE_POOL.alarm;if(type==='delivery')return THREE_CHOICE_POOL.delivery;return THREE_CHOICE_POOL.default}

function anchorRect(anchor){const layer=dom.popupLayer,w=layer.clientWidth,h=layer.clientHeight,cw=Math.min(420,w*.88),pad=14;const cx=(w-cw)/2;const bottomBar=118+Math.max(0,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')||0));const yFront=Math.min(h-bottomBar-112,Math.max(h*.60,h-250));const map={center_low:[cx,yFront],center:[cx,Math.max(h*.52,yFront-64)],left_float:[Math.max(pad,cx-18),yFront-34],right_float:[Math.min(w-cw-pad,cx+18),yFront-28],top_drop:[cx,Math.max(8,h*.18)]};const base=map[anchor]||map.center_low;return{x:Math.max(pad,Math.min(w-cw-pad,base[0]+randRange(-10,10))),y:Math.max(8,Math.min(h-bottomBar-104,base[1]+randRange(-8,10))),w:cw}}
function updateCardLayers(){const active=Game.popups.filter(p=>!p.resolved);if(active.length===0)return;const sorted=[...active].sort((a,b)=>(parseInt(a.el.style.zIndex)||0)-(parseInt(b.el.style.zIndex)||0));const front=sorted[sorted.length-1];sorted.forEach((p,i)=>{const depth=sorted.length-1-i;p.el.classList.remove('stack-front','stack-mid','stack-deep','side-hint','ghost-notification','depth-1','depth-2','depth-3');if(depth===0){const pos=p.anchorPos||anchorRect('center_low');p.el.style.display='grid';p.el.classList.add('stack-front');p.el.style.opacity='1';p.el.style.pointerEvents='auto';p.el.style.zIndex=300;p.el.style.left=pos.x+'px';p.el.style.top=pos.y+'px';p.el.style.transform=`rotate(${p.el.dataset.rotation||0}deg) scale(1)`;p.anchorPos=pos;return}if(depth<=MAX_VISIBLE_GHOSTS){p.el.style.display='grid';p.el.classList.add('side-hint','depth-'+depth);p.el.style.pointerEvents='none';p.el.style.zIndex=300-depth;const x=(front.anchorPos?.x||20)+randRange(-8,8);const y=(front.anchorPos?.y||260)-depth*28;const sc=1-depth*.045;p.el.style.left=x+'px';p.el.style.top=Math.max(8,y)+'px';p.el.style.transform=`rotate(${randRange(-2.5,2.5)}deg) scale(${sc})`;return}p.el.style.display='none';p.el.style.pointerEvents='none'});updatePressureInd()}
function spawnPopup(eventData,isRandom=false,mode='normal'){if(Game.ended||Game.paused)return null;const active=Game.popups.filter(p=>!p.resolved).length;if(active>=MAX_ACTIVE_NOTICES){Game.pendingQueue=Game.pendingQueue||[];Game.pendingQueue.push(eventData);Game.congestionUntil=Date.now()+3000;updatePressureInd();return null}const evData=eventData.actions?.length===3&&eventData.notificationTitle?eventData:prepareEventForPlay(eventData);const id=++Game.popupIdCounter,anchor=chooseAnchor(evData,mode),pos=anchorRect(anchor),el=document.createElement('div');const training=(Date.now()-Game.gameStartTime)<20000;el.className='popup anchor-'+anchor.replace('_','-')+(isRandom?' random-event':'')+(mode==='interrupt'?' interrupt-in':'')+(evData.revisitLabel?' revisit-in':'')+(training?' training-hint':' compact-hint');el.dataset.id=id;el.dataset.revisitLabel=evData.revisitLabel||'';el.dataset.rotation=randRange(-1.6,1.6);el.style.left=pos.x+'px';el.style.top=(pos.y+18)+'px';el.style.zIndex=++Game.zIndexCounter;const timeoutSec=Math.max(6,Math.round(evData.timeout*(Game.pressureScore>70?.9:1)));el.dataset.timeout=timeoutSec;el.dataset.createdAt=Date.now();const hints=evData.actions.map(a=>`<span>${compactHint(a)}</span>`).join('');el.innerHTML=`<div class="popup-header"><span class="popup-source"><span class="popup-source-icon">${evData.icon}</span><span class="popup-source-text">${evData.notificationTitle||evData.source}</span></span><span class="popup-timer">${training?'现在':'1分钟前'}</span></div><div class="popup-countdown-bar"><div class="popup-countdown-fill" style="width:100%"></div></div><div class="popup-body">${evData.preview||evData.text}</div><div class="popup-hints">${hints}</div><div class="hold-ring"></div><div class="rapid-dots"><span></span><span></span><span></span></div><div class="popup-swipe-fb left"></div><div class="popup-swipe-fb right"></div><div class="popup-swipe-fb up"></div><div class="popup-swipe-fb down"></div>`;dom.popupLayer.appendChild(el);const popupObj={id,el,eventData:evData,timeoutSec,resolved:false,isRandom,anchor,anchorPos:pos};Game.popups.push(popupObj);Game.tracker.totalPopups++;bindPopupEvents(popupObj);sfxPopup();requestAnimationFrame(updateCardLayers);updateEmptyHint();return popupObj}
function bindPopupEvents(popup){const el=popup.el,eventData=popup.eventData;let sx=0,sy=0,st=0,origX=0,origY=0,down=false,holdTimer=null,rapidCount=0,lastTap=0;const SWIPE_X=70,SWIPE_Y=80,TAP_MOVE=14;function a(g){return eventData.actions.find(x=>x.gesture===g)}function clearHold(){if(holdTimer){clearInterval(holdTimer);holdTimer=null}const ring=el.querySelector('.hold-ring');if(ring){ring.classList.remove('active','done');ring.style.background=''}}function startHold(act){const ring=el.querySelector('.hold-ring');if(!ring)return;const start=Date.now(),dur=Math.max(1200,(act.duration||1.8)*1000);ring.classList.add('active');holdTimer=setInterval(()=>{const pct=Math.min(100,(Date.now()-start)/dur*100);ring.style.background=`conic-gradient(var(--color-neutral-progress) ${pct*3.6}deg, transparent 0)`;if(pct>=100){clearHold();resolvePopup(popup,act)}},45)}el.addEventListener('pointerdown',e=>{if(Game.ended)return;if(!isFrontPopup(popup)){blockNonFrontPopup(popup);return}initAudio();down=true;sx=e.clientX;sy=e.clientY;st=Date.now();origX=el.offsetLeft;origY=el.offsetTop;el.setPointerCapture?.(e.pointerId);document.getElementById('bottom-bar')?.classList.add('drag-locked');const lp=a('longpress');if(lp)startHold(lp)});el.addEventListener('pointermove',e=>{if(!down||Game.ended||!isFrontPopup(popup))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>TAP_MOVE||Math.abs(dy)>TAP_MOVE)clearHold();el.classList.add('dragging');el.style.left=Math.max(-30,Math.min(dom.popupLayer.clientWidth-60,origX+dx))+'px';el.style.top=Math.max(0,Math.min(dom.popupLayer.clientHeight-100,origY+dy))+'px'});el.addEventListener('pointerup',e=>{document.getElementById('bottom-bar')?.classList.remove('drag-locked');if(!down)return;down=false;el.classList.remove('dragging');clearHold();if(Game.ended||!isFrontPopup(popup))return;const dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st;let g=null;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>=SWIPE_X)g=dx<0?'swipe_left':'swipe_right';else if(Math.abs(dy)>=SWIPE_Y)g=dy<0?'swipe_up':'swipe_down';if(g){const act=a(g);if(act){resolvePopup(popup,act);return}wrongGesture(el,'不是这条路')}else if(Math.abs(dx)<TAP_MOVE&&Math.abs(dy)<TAP_MOVE&&dt<420){const rc=a('rapid_click'),ca=a('click');if(rc){const now=Date.now();rapidCount=now-lastTap<650?rapidCount+1:1;lastTap=now;el.querySelectorAll('.rapid-dots span').forEach((s,i)=>s.classList.toggle('filled',i<rapidCount));if(rapidCount>=3){resolvePopup(popup,rc);return}return}if(ca){resolvePopup(popup,ca);return}}const r=el.dataset.rotation||0;el.style.transition='left .22s cubic-bezier(.25,.8,.25,1.2), top .22s cubic-bezier(.25,.8,.25,1.2)';el.style.left=origX+'px';el.style.top=origY+'px';el.style.transform=`rotate(${r}deg)`;setTimeout(()=>el.style.transition='',240)});el.addEventListener('pointercancel',()=>{down=false;clearHold();document.getElementById('bottom-bar')?.classList.remove('drag-locked')})}
function timeoutPopup(popup){if(!Game.popups.includes(popup)||popup.resolved)return;popup.resolved=true;updateStats(popup.eventData.timeoutEffects||{battery:0,emotion:-3,persona:-4,progress:-2});Game.missedLog=Game.missedLog||[];Game.missedLog.push({t:Date.now(),event:popup.eventData});Game.tracker.timedOutPopups++;Game.consecutiveIgnores++;Game.pressureScore=Math.min(100,Game.pressureScore+6);popup.el.classList.add('timed-out');sfxTimeout();showFeedback(popup.el,'错过了');setTimeout(()=>removePopup(popup),350)}
function removePopup(popup){const idx=Game.popups.indexOf(popup);if(idx>=0)Game.popups.splice(idx,1);if(popup.el&&popup.el.parentNode)popup.el.remove();if(Game.popups.filter(p=>!p.resolved).length<=4)Game.congestionUntil=0;updateCardLayers();updateEmptyHint();updatePressureInd()}
function buildRhythmPlan(){const duration=(Game.gameDuration||150)*1000,start=Date.now(),opening=randRange(8000,14000),windowCount=Math.random()<.72?1:2,windows=[];let cursor=start+opening+randRange(8000,18000);for(let i=0;i<windowCount;i++){const latest=start+Math.max(opening+12000,duration-26000),at=Math.min(cursor,latest);windows.push({start:at,end:at+randRange(7500,13000),used:false});cursor=at+randRange(28000,46000)}return{start,openingUntil:start+opening,windows,recoveryUntil:0,pressureUsed:false,lastMode:'calm'}}
function rhythmPressureWindow(now){return(Game.rhythmPlan?.windows||[]).find(w=>now>=w.start&&now<=w.end)}
function stageWaveMode(){const now=Date.now(),plan=Game.rhythmPlan||(Game.rhythmPlan=buildRhythmPlan());if(now<plan.openingUntil)return weightedPick([['calm',58],['trickle',42]]);if(now<plan.recoveryUntil)return'recovery';const window=rhythmPressureWindow(now);if(window){window.used=true;plan.pressureUsed=true;return'pressure'}return weightedPick([['calm',36],['trickle',46],['burst',18]])}
function waveRuleFor(mode){return{calm:{count:[0,1],gap:[520,980],after:[760,1450],idle:[620,1150]},trickle:{count:[1,2],gap:[520,900],after:[850,1600],idle:[560,1100]},burst:{count:[2,4],gap:[320,620],after:[1000,1900],idle:[620,1200]},pressure:{count:[3,5],gap:[260,520],after:[2200,3800],idle:[680,1250]},recovery:{count:[0,1],gap:[700,1200],after:[1500,2700],idle:[900,1500]}}[mode]||{count:[1,1],gap:[600,900],after:[900,1400],idle:[600,1000]}}
function spawnWaveItem(i,total){if(Game.ended||Game.paused)return;if((Game.totalSpawned||0)>=(Game.targetEventTotal||22))return;const active=Game.popups.filter(p=>!p.resolved).length;if(active>=5){Game.congestionUntil=Date.now()+randRange(1600,2800);return}let evData=(Game.pendingQueue&&Game.pendingQueue.shift())||dueDebtEvent()||pickStageEvent();const mode=evData.revisitLabel?'revisit':(canInterject(evData)?'interrupt':'normal');if(mode==='interrupt')Game.stageInterrupts++;const popup=spawnPopup(evData,!!evData.revisitLabel,mode);if(popup)Game.totalSpawned=(Game.totalSpawned||0)+1}
function finishIfNoMoreEvents(){if(Game.ended||!Game.rhythmPlan?.pressureUsed)return false;const active=Game.popups.filter(p=>!p.resolved).length;if((Game.totalSpawned||0)>=(Game.targetEventTotal||22)&&active===0){setTimeout(()=>{if(!Game.ended&&Game.popups.filter(p=>!p.resolved).length===0)endGame(true)},350);return true}return false}
function scheduleNextSpawn(){if(Game.ended||Game.paused)return;if(finishIfNoMoreEvents())return;const mode=stageWaveMode(),rule=waveRuleFor(mode),idle=randRange(rule.idle[0],rule.idle[1]),count=Math.floor(randRange(rule.count[0],rule.count[1]+1));Game.waveMode=mode;if(mode==='pressure'){Game.targetEventTotal=Math.max(Game.targetEventTotal||22,(Game.totalSpawned||0)+count);Game.rhythmPlan.recoveryUntil=Date.now()+idle+count*rule.gap[1]+randRange(1800,3200)}Game.spawnTimer=setTimeout(()=>{if(Game.ended||Game.paused){scheduleNextSpawn();return}if(finishIfNoMoreEvents())return;if(Date.now()<(Game.congestionUntil||0)){scheduleNextSpawn();return}let t=0;for(let i=0;i<count;i++){t+=randRange(rule.gap[0],rule.gap[1]);setTimeout(()=>spawnWaveItem(i,count),t)}Game.spawnTimer=setTimeout(()=>{Game.waveMode='calm';scheduleNextSpawn()},t+randRange(rule.after[0],rule.after[1]))},idle)}
function updatePressureInd(){const n=Game.popups.filter(p=>!p.resolved).length,pending=Game.pendingQueue?.length||0,ind=dom.pressureInd;ind.classList.remove('show','high');if(n>=6){ind.textContent='拥堵 '+n;ind.classList.add('show','high')}else if(n>=4){ind.textContent='待处理 '+n+(pending?` +${pending}`:'');ind.classList.add('show',n>=5?'high':'')}}
function startGame(){clearTimeout(Game.spawnTimer);clearInterval(Game.gameLoopTimer);showScreen(dom.game);Game.stats={battery:70,emotion:65,persona:75,progress:30};Game.popups=[];Game.popupIdCounter=0;Game.zIndexCounter=100;Game.gameStartTime=Date.now();Game.ended=false;Game.gameTime=0;Game.paused=false;Game.lastEmptyHint=0;Game.pressureScore=12;Game.consecutiveIgnores=0;Game.tracker={totalPopups:0,handledPopups:0,timedOutPopups:0,fakeSmileCount:0,ignoreCount:0,honestCount:0,crisisCount:0,longPressSuccess:0,longPressFail:0,swipeAway:0};Game.usedEvents=new Set();Game.debtQueue=[];Game.pendingQueue=[];Game.missedLog=[];Game.congestionUntil=0;Game.dayStage=null;Game.targetEventTotal=Math.floor(randRange(15,26));Game.totalSpawned=0;Game.stageBudget=0;Game.stageSpawned=0;Game.stageInterrupts=0;Game.usedStageEvents=new Set();Game.waveMode='calm';Game.rhythmPlan=buildRhythmPlan();dom.popupLayer.innerHTML='<div id="empty-hint"></div><div id="pressure-indicator"></div>';dom.emptyHint=$('#empty-hint');dom.pressureInd=$('#pressure-indicator');dom.game.classList.remove('shaking','critical-border');dom.crisisOverlay.classList.remove('active');dom.phaseTransition.classList.remove('show');dom.phaseTag.textContent='';dom.batteryIcon.style.width='60%';dom.batteryIcon.style.background='var(--color-neutral-progress)';updateStatUI();updateAvatarStatus();domEmergency.drawer.classList.remove('open');domEmergency.backdrop.classList.remove('show');domEmergency.list.innerHTML='';domEmergency.badge.style.display='none';domEmergency.clearCount.textContent='(0)';showIdleHint();setTimeout(scheduleNextSpawn,900);Game.gameLoopTimer=setInterval(()=>{updateCountdowns();checkPhase()},200)}

function updateCountdowns(){if(Game.paused)return;const now=Date.now();Game.popups.forEach(p=>{if(!p||p.resolved||!p.el)return;const createdAt=Number(p.el.dataset.createdAt)||now,timeoutSec=Math.max(.1,Number(p.timeoutSec)||Number(p.el.dataset.timeout)||6),elapsed=(now-createdAt)/1000,remaining=Math.max(0,timeoutSec-elapsed),progress=Math.max(0,Math.min(1,remaining/timeoutSec)),timerEl=p.el.querySelector('.popup-timer'),barEl=p.el.querySelector('.popup-countdown-bar'),fillEl=p.el.querySelector('.popup-countdown-fill');p.timeoutSec=timeoutSec;p.el.style.setProperty('--countdown-progress',progress);if(timerEl){const rm=Math.ceil(remaining),rmm=Math.floor(rm/60),rss=Math.floor(rm%60);timerEl.textContent=rmm>0?String(rmm).padStart(2,'0')+':'+String(rss).padStart(2,'0'):'00:'+String(rss).padStart(2,'0');timerEl.classList.toggle('urgent',remaining<5)}if(barEl)barEl.classList.toggle('urgent',remaining<5);if(fillEl){fillEl.style.transform=`scaleX(${progress})`;fillEl.classList.toggle('urgent',remaining<5)}p.el.classList.remove('urgent','critical-time');if(remaining<3)p.el.classList.add('critical-time');else if(remaining<5)p.el.classList.add('urgent');if(remaining<1.5&&remaining>0&&!p._shook){p._shook=true;dom.game.classList.add('shaking');setTimeout(()=>{if((Game.pressureScore||0)<88)dom.game.classList.remove('shaking')},200)}if(remaining<=0)timeoutPopup(p)})}

// ==================== EMERGENCY DRAWER ====================
function openEmergencyDrawer(){
  if(Game.ended||Game.paused)return;
  // Find most urgent popups: closest to timeout, worst effects
  const now=Date.now();
  const urgent=Game.popups.filter(p=>!p.resolved).map(p=>{
    const elapsed=(now-parseInt(p.el.dataset.createdAt))/1000;
    const remaining=Math.max(0,p.timeoutSec-elapsed);
    const worstEffect=Math.min(0,...(p.eventData.timeoutEffects?[p.eventData.timeoutEffects.battery||0,p.eventData.timeoutEffects.emotion||0,p.eventData.timeoutEffects.persona||0,p.eventData.timeoutEffects.progress||0]:[0]));
    return {popup:p,remaining,worstEffect};
  }).sort((a,b)=>a.remaining-b.remaining).slice(0,5);
  domEmergency.list.innerHTML=urgent.length===0
    ?'<div class="emergency-empty">暂无紧急通知<br>处理得不错</div>'
    :urgent.map(u=>{
      const p=u.popup,d=p.eventData,rm=Math.ceil(u.remaining);
      const rmm=Math.floor(rm/60),rss=Math.floor(rm%60);
      const timeDisp=rmm>0?String(rmm).padStart(2,'0')+':'+String(rss).padStart(2,'0'):'00:'+String(rss).padStart(2,'0');
      const effects=[];
      if(d.timeoutEffects){
        if(d.timeoutEffects.battery)effects.push(`生命${d.timeoutEffects.battery>0?'+':''}${d.timeoutEffects.battery}`);
        if(d.timeoutEffects.emotion)effects.push(`情绪${d.timeoutEffects.emotion>0?'+':''}${d.timeoutEffects.emotion}`);
        if(d.timeoutEffects.persona)effects.push(`人设${d.timeoutEffects.persona>0?'+':''}${d.timeoutEffects.persona}`);
        if(d.timeoutEffects.progress)effects.push(`进度${d.timeoutEffects.progress>0?'+':''}${d.timeoutEffects.progress}`);
      }
      const bestAction=d.actions[0]; // First action is usually best
      return`<div class="emergency-item">
        <div class="emergency-item-header">
          <span class="emergency-item-source"><span class="emergency-item-source-icon">${d.icon}</span>${d.source}</span>
          <span class="emergency-item-time">${timeDisp}</span>
        </div>
        <div class="emergency-item-body">${d.text}</div>
        ${effects.length?`<div class="emergency-item-effects">${effects.map(e=>`<span class="emergency-item-eff">${e}</span>`).join('')}</div>`:''}
        <div class="emergency-item-actions">
          <button class="emergency-item-btn primary" data-popup-id="${p.id}">跳转到此卡片</button>
          ${bestAction?`<span style="font-size:10px;color:var(--text-muted);align-self:center">推荐：${bestAction.label}</span>`:''}
        </div>
      </div>`;
    }).join('');
  domEmergency.drawer.classList.add('open');
  domEmergency.backdrop.classList.add('show');
  // Bind locate buttons
  domEmergency.list.querySelectorAll('.emergency-item-btn.primary').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const popupId=parseInt(btn.dataset.popupId);
      const p=Game.popups.find(x=>x.id===popupId);
      if(p&&p.el){
        p.el.style.zIndex=++Game.zIndexCounter;
        p.el.classList.add('burst-in');
        updateCardLayers();
        sfxClick();
      }
      closeEmergencyDrawer();
    });
  });
}
function closeEmergencyDrawer(){domEmergency.drawer.classList.remove('open');domEmergency.backdrop.classList.remove('show')}
function updateEmergencyBadge(){
  const urgentCount=Game.popups.filter(p=>!p.resolved&&(p.el.querySelector('.popup-timer.urgent'))).length;
  domEmergency.badge.textContent=urgentCount;
  domEmergency.badge.style.display=urgentCount>0?'flex':'none';
}
function updateClearCount(){
  domEmergency.clearCount.textContent='('+Game.popups.filter(p=>!p.resolved).length+')';
  if(typeof finishIfNoMoreEvents==='function')finishIfNoMoreEvents();
}

// ==================== INIT ====================
function init(){
  showScreen(dom.intro);
  $('#btn-start').addEventListener('click',()=>{initAudio();sfxClick();showScreen(dom.tutorial);Tutorial.showIntro()});
  $('#btn-restart').addEventListener('click',()=>{initAudio();sfxClick();startGame()});
  dom.popupLayer.addEventListener('touchmove',e=>{if(e.target.closest('.popup'))e.preventDefault()},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  // Bottom bar
  domEmergency.emergencyBtn.addEventListener('click',()=>{initAudio();sfxClick();openEmergencyDrawer()});
  domEmergency.close.addEventListener('click',()=>{initAudio();sfxClick();closeEmergencyDrawer()});
  domEmergency.backdrop.addEventListener('click',()=>{closeEmergencyDrawer()});
  domEmergency.clearBtn.addEventListener('click',()=>{
    initAudio();sfxClick();
    Game.popups.filter(p=>!p.resolved).forEach(p=>{if(p.eventData&&shouldCreateDebt({label:'清空',gesture:'clear'}))revisitEvent(p.eventData,{label:'清空',gesture:'clear'});p.resolved=true;p.el.style.transform='';p.el.classList.add('resolved');setTimeout(()=>removePopup(p),250)});
    updateStats({battery:0,emotion:-5,persona:-5,progress:-5});
    updateClearCount();
  });
  domEmergency.tasksBtn.addEventListener('click',()=>{
    initAudio();sfxClick();
    // Show task summary: count active popups
    const n=Game.popups.filter(p=>!p.resolved).length;
    if(n===0){spawnSystemToast();return}
    const t=document.createElement('div');
    t.className='system-toast';
    t.textContent=`待处理通知：${n} 条`;
    dom.popupLayer.appendChild(t);
    setTimeout(()=>t.remove(),2500);
  });
}
init();
